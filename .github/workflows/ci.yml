name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs: a tag can be moved, a SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The private-material scan reads every commit, not only the tip.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true

      # --locked fails if uv.lock is stale, so CI tests exactly what was committed.
      - run: uv sync --locked

      - run: uv run ruff check --output-format=github
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run pytest

      # The names live in a repository secret, so the scan never contains them; without the
      # secret the step fails rather than passing on home paths alone.
      - run: uv run python -m tools.private_scan --history --require-names
        env:
          PRIVATE_NAMES: ${{ secrets.PRIVATE_NAMES }}
