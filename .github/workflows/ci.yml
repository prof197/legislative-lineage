name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # requires-python is ">=3.13". Every dependency ships wheels for 3.13 and 3.14, and so do
        # the two the semantic stage will add (fastembed and onnxruntime, faiss-cpu).
        python: ["3.13", "3.14"]
    env:
      # Overrides .python-version, which pins local development to 3.13.
      UV_PYTHON: ${{ matrix.python }}
    steps:
      # Actions are pinned to commit SHAs: a tag can be moved, a SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The leak check reads every commit, not only the tip.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true

      # --locked fails if uv.lock is stale, so CI tests exactly what was committed. The build
      # extra brings faiss, which the semantic stage's index build and its tests need.
      - run: uv sync --locked --extra build

      - run: uv run ruff check --output-format=github
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run pytest

      # The deny list lives in a repository secret, so the repo never lists it. GitHub gives no
      # secrets to a run in a fork or to a pull request from one, so there the check is skipped
      # with a notice; it runs when the change reaches this repository. Here a missing secret
      # fails the step rather than passing on local paths alone.
      # The check reads the repository, not the interpreter, so one run is enough.
      - name: Leak check
        if: matrix.python == '3.13'
        env:
          LEAK_CHECK_TERMS: ${{ secrets.LEAK_CHECK_TERMS }}
          # A push in a fork, or a pull request whose head is in another repository.
          FROM_FORK: ${{ github.event.repository.fork || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
        run: |
          if [ -z "$LEAK_CHECK_TERMS" ] && [ "$FROM_FORK" = "true" ]; then
            echo "::notice title=Leak check skipped::Runs from forks get no repository secrets, so the deny list is unavailable here. The check runs once the change reaches this repository."
            exit 0
          fi
          uv run python -m tools.leak_check --history --require-terms

  # The static site (DR-1): its types must match the export's schema, and it must type-check
  # and build. It builds from the committed fixture export; the deploy builds from the release.
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run types:check
      - run: npm run data:fixture
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
