[project]
name = "legislative-lineage"
version = "0.1.0"
description = "Find state bills that share provisions, section by section, without an API key."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "prof197", email = "5631043+prof197@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.6.0,<3",
    "duckdb>=2.0.0",
    "fastembed>=0.9.1,<0.10",
    "numpy>=2.5.4",
    "pydantic>=2.14.3,<3",
    "pypdf>=6.21.4,<7",
    "typer>=0.27.3",
]

[project.scripts]
lineage = "lineage.cli:app"

[project.optional-dependencies]
build = [
    "faiss-cpu>=1.15.1",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lineage"

[dependency-groups]
dev = [
    "datasketch>=2.0.0",
    "import-linter>=2.17",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "PTH",      # pathlib over os.path
    "PT",       # pytest style
    "RUF",
    "C90",      # mccabe complexity
]

[tool.ruff.lint.mccabe]
# Ruled at M13's step 1 review. A function over it is allow-listed only by a `noqa: C901` on
# its def, which RUF100 reports once the function is back under the limit.
max-complexity = 15

[tool.pyright]
include = ["src", "tests", "benchmarks", "evals", "tools"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root, so tests can import the dev-only benchmarks package.
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]

# The layering rule (DESIGN.md#module-map), checked in CI by `uv run lint-imports`.
[tool.importlinter]
root_package = "lineage"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: a module imports only from its own layer and those below"
type = "layers"
containers = ["lineage"]
layers = [
    "cli",
    "live",
    "export",
    "origins",
    "evals",
    "explain",
    "align",
    "match",
    "text",
    "data",
    "core",
]
exhaustive = true

[[tool.importlinter.contracts]]
name = "Match: near below semantic, both below the modules that combine them"
type = "layers"
containers = ["lineage.match"]
layers = ["query : relatives : listing : state_boilerplate : strata : queries", "semantic", "near"]
exhaustive = true

[[tool.importlinter.contracts]]
name = "Collectors: each source's collector stands alone"
type = "independence"
modules = ["lineage.origins.collectors.*"]
# IFS's documents are on its co-publisher EPPC's site and read with EPPC's reader.
ignore_imports = ["lineage.origins.collectors.ifs -> lineage.origins.collectors.eppc"]

[[tool.importlinter.contracts]]
name = "Model calls: the Anthropic SDK only in the explanation step and the model labels"
type = "forbidden"
source_modules = ["lineage"]
forbidden_modules = ["anthropic"]
allow_indirect_imports = true
ignore_imports = [
    "lineage.explain.explain -> anthropic",
    "lineage.evals.model_labels -> anthropic",
    "lineage.evals.faithfulness -> anthropic",
]

[[tool.importlinter.contracts]]
name = "faiss, the build extra, only behind lineage.match.semantic.ann"
type = "forbidden"
source_modules = ["lineage"]
forbidden_modules = ["faiss"]
allow_indirect_imports = true
ignore_imports = ["lineage.match.semantic.ann -> faiss"]
